<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="%238a7cff"/><path d="M12.5 9.2a1 1 0 0 1 1.52-.86l8.3 5.1a1 1 0 0 1 0 1.72l-8.3 5.1A1 1 0 0 1 12.5 19.4z" fill="%23fff"/></svg>'>
<title>Autorização — EditApp</title>
<style>
  :root { color-scheme: dark; --bg:#0e0e11; --texto:#e8e8ea; --fraco:#9a9aa5; --linha:#26262e; --destaque:#8a7cff; }
  body { margin:0; background:var(--bg); color:var(--texto); font:16px/1.6 system-ui, sans-serif; }
  main { max-width:40rem; margin:0 auto; padding:64px 16px; }
  h1 { font-size:1.5rem; margin:0 0 8px; }
  p { color:var(--fraco); }
  code { display:block; word-break:break-all; background:#17171d; border:1px solid var(--linha);
         border-radius:10px; padding:14px; margin:20px 0 12px; color:var(--texto); font-size:.9rem; }
  button { font:inherit; background:var(--destaque); color:#fff; border:0; border-radius:8px;
           padding:10px 18px; cursor:pointer; }
  .erro { color:#ff8f8f; }
</style>
</head>
<body>
<main>
  <h1>Autorização recebida</h1>
  <!-- Esta página não fala com servidor nenhum: ela só lê o código que a rede
       devolveu na barra de endereços e o mostra para ser colado no app, que
       roda em localhost e não pode ser o endereço de volta. -->
  <p id="recado">Copie o código abaixo e cole no EditApp, em Publicar → colar código.</p>
  <code id="codigo">—</code>
  <button id="copiar">Copiar código</button>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const codigo = params.get("code");
  const erro = params.get("error_description") || params.get("error");
  const alvo = document.getElementById("codigo");
  const recado = document.getElementById("recado");

  if (codigo) {
    alvo.textContent = codigo;
  } else {
    recado.className = "erro";
    recado.textContent = erro ? "A rede não autorizou: " + erro : "Nenhum código veio nesta URL.";
    alvo.textContent = location.href;
  }

  document.getElementById("copiar").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(alvo.textContent);
      document.getElementById("copiar").textContent = "Copiado";
    } catch {
      // Sem permissão de área de transferência: selecionar à mão resolve.
      getSelection().selectAllChildren(alvo);
    }
  });
</script>
</body>
</html>
