<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raphael Busquet</title>
<meta name="description" content="Canal no YouTube, meu setup, newsletter e ebook.">
<meta property="og:title" content="Raphael Busquet">
<meta property="og:description" content="Canal no YouTube, meu setup, newsletter e ebook.">
<meta property="og:image" content="https://raphaelbusquet.github.io/links/img/foto.jpg">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="img/foto.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --fundo: #141414;
    --cartao: #000;
    --botao: rgba(255, 255, 255, .07);
    --botao-hover: rgba(255, 255, 255, .12);
    --texto: #fff;
    --fraco: #b5b5b5;
    --luz-verde: rgba(16, 150, 120, .22);
    --luz-azul: rgba(50, 80, 255, .20);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fundo); }
  body {
    color: var(--texto);
    font: 500 16px/1.4 "Quicksand", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--cartao);
    border-radius: 20px;
    padding: 36px 16px 20px;
    text-align: center;
    position: relative;
    isolation: isolate;
    overflow: hidden;
  }
  /* Luzes esfumaçadas nas cores da foto, atrás de tudo. */
  main::before, main::after {
    content: "";
    position: absolute;
    z-index: -1;
    width: 360px; height: 360px;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    animation: flutuar 18s ease-in-out infinite alternate;
  }
  main::before {
    background: var(--luz-verde);
    width: 460px; height: 460px;
    top: -140px; left: -200px;
    filter: blur(110px);
  }
  main::after { background: var(--luz-azul); bottom: 120px; right: -160px; animation-delay: -9s; }
  .luz {
    position: absolute; z-index: -1;
    width: 300px; height: 300px; left: 50%; top: 42%;
    margin-left: -150px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(50, 80, 255, .12), transparent 70%);
    filter: blur(50px);
    pointer-events: none;
  }
  @keyframes flutuar {
    to { transform: translate(40px, 60px) scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) {
    main::before, main::after { animation: none; }
  }
  .foto {
    width: 148px; height: 148px;
    margin: 0 auto 18px;
    border-radius: 50%;
    overflow: hidden;
  }
  .foto img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.12); display: block; }
  h1 { font-size: 1.75rem; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .chamada {
    display: inline-block;
    margin: 4px 0 20px;
    font-size: .72rem; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase;
    color: var(--texto); text-decoration: none;
  }
  .chamada:hover { text-decoration: underline; }
  .video {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    overflow: hidden;
    background: #111;
    margin-bottom: 14px;
  }
  .video iframe, .video button { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video button { padding: 0; cursor: pointer; background: none; }
  .video button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .video button svg { position: absolute; left: 50%; top: 50%; width: 68px; transform: translate(-50%, -50%); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 12px;
    min-height: 60px;
    padding: 6px 52px 6px 6px;
    border-radius: 999px;
    background: var(--botao);
    border: 1px solid rgba(255, 255, 255, .06);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--texto); text-decoration: none;
    font-weight: 700; font-size: 1rem;
    transition: background .15s, transform .15s;
  }
  .link:hover { background: var(--botao-hover); }
  .link:active { transform: scale(.98); }
  .link:focus-visible { outline: 2px solid var(--texto); outline-offset: 3px; }
  .link img {
    width: 48px; height: 48px; flex: none;
    border-radius: 50%;
    border: 1px solid #2c2c2c;
  }
  .link span { flex: 1; }
  footer { margin-top: 28px; font-size: .75rem; color: var(--fraco); }
  @media (max-width: 480px) {
    body { padding: 0; }
    main { border-radius: 0; min-height: 100vh; padding-top: 44px; }
  }
</style>
</head>
<body>
<main>
  <div class="luz" aria-hidden="true"></div>
  <div class="foto"><img src="img/foto.jpg" alt="Foto de Raphael Busquet" width="148" height="148"></div>
  <h1>Raphael Busquet</h1>
  <a class="chamada" href="https://www.youtube.com/@raphaelbusquet?sub_confirmation=1" target="_blank" rel="noopener">Inscreva-se no canal do YouTube 👇</a>

  <div class="video" id="video">
    <button type="button" aria-label="Assistir: A mentalidade que me ajudou a realizar boa parte dos meus objetivos">
      <img src="https://i.ytimg.com/vi/_amsgsVau0E/hqdefault.jpg" alt="">
      <svg viewBox="0 0 68 48" aria-hidden="true"><path d="M66.5 7.7a8.6 8.6 0 0 0-6-6C55.2.3 34 .3 34 .3s-21.2 0-26.5 1.4a8.6 8.6 0 0 0-6 6C.1 13 .1 24 .1 24s0 11 1.4 16.3a8.6 8.6 0 0 0 6 6C12.8 47.7 34 47.7 34 47.7s21.2 0 26.5-1.4a8.6 8.6 0 0 0 6-6C67.9 35 67.9 24 67.9 24s0-11-1.4-16.3z" fill="#f00"/><path d="M45 24 27 14v20z" fill="#fff"/></svg>
    </button>
  </div>

  <ul>
    <li><a class="link" href="https://raphaelbusquet.github.io/setup/">
      <img src="img/setup.png" alt="" width="48" height="48"><span>Meu Setup</span></a></li>
    <li><a class="link" href="https://raphaelbusquet.substack.com" target="_blank" rel="noopener">
      <img src="img/substack.png" alt="" width="48" height="48"><span>Newsletter</span></a></li>
    <li><a class="link" href="https://ebook-1000-prompts.raphaelbusquet.workers.dev" target="_blank" rel="noopener">
      <img src="img/ebook.png" alt="" width="48" height="48"><span>Ebook</span></a></li>
  </ul>

  <footer>© Raphael Busquet</footer>
</main>
<script>
  // Carrega o player só no toque: a página abre rápido mesmo no 4G.
  document.querySelector('#video button').addEventListener('click', function () {
    const f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/_amsgsVau0E?autoplay=1&playsinline=1&origin=' + encodeURIComponent(location.origin);
    // Sem Referer o YouTube recusa o player (erro 153).
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.title = 'A mentalidade que me ajudou a realizar boa parte dos meus objetivos';
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    this.replaceWith(f);
  });
</script>
</body>
</html>
